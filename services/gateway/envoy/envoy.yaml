static_resources:
  listeners:
    - name: listener_edge
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: edge_routing_table
                  virtual_hosts:
                    - name: api_gateway_host
                      domains: ["*"]
                      routes:
                        # Health endpoint routing
                        - match:
                            prefix: "/health"
                          route:
                            cluster: go_gateway_cluster
                            timeout: 5s
                        # Default catch-all route for future downstream services
                        - match:
                            prefix: "/"
                          route:
                            cluster: go_gateway_cluster
                            timeout: 10s
                            retry_policy:
                              retry_on: "5xx,gateway-error,connect-failure,refused-stream"
                              num_retries: 3
                              per_try_timeout: 3s

  clusters:
    - name: go_gateway_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: go_gateway_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # Resolves to the Go server service name in Docker networking
                      address: gateway-app
                      port_value: 8080