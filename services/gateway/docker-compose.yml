services:
  # Downstream-facing Envoy Proxy (Client-facing edge)
  gateway-proxy:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "10000:10000"
    networks:
      - gateway-net
    depends_on:
      - gateway-app

  # Upstream Go Application (Internal backend)
  gateway-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge