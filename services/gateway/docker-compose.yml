services:
  gateway-proxy:
    build:
      context: .
      dockerfile: Dockerfile.envoy
    ports:
      - "10000:10000"
    networks:
      - gateway-net
    depends_on:
      - gateway-app

  gateway-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=8080
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - gateway-net

  identity:
    image: traefik/whoami
    command: --port 8000
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge