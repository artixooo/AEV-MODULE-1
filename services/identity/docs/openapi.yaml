openapi: 3.0.3
info:
  title: Identity Service Authentication API
  version: 1.0.0
  description: |
    API contract v1 for Identity Service authentication.
    The API Gateway exposes these endpoints under /api/v1/auth
    and proxies requests to the Identity Service.

servers:
  - url: http://localhost:8080
    description: API Gateway

tags:
  - name: Authentication
    description: Login and access-token refresh operations

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: |
        Authenticates a user using their email address and password.
        This endpoint does not require authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
            example:
              email: user@example.com
              password: password
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: <JWT access token>
                refresh_token: <JWT refresh token>
                token_type: bearer
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Invalid credentials
        '403':
          description: User account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: User account is not active

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Generates a new JWT access token using a valid refresh token.
        The refresh token is accepted as a query parameter.
      parameters:
        - name: refresh_token
          in: query
          required: true
          description: JWT refresh token
          schema:
            type: string
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                access_token: <new JWT access token>
                token_type: bearer
        '401':
          description: Invalid, expired, or incorrectly typed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_or_expired:
                  summary: Invalid or expired refresh token
                  value:
                    detail: Invalid or expired refresh token
                invalid_type:
                  summary: Invalid token type
                  value:
                    detail: Invalid token type
                invalid_payload:
                  summary: Invalid refresh token payload
                  value:
                    detail: Invalid refresh token payload

components:
  schemas:
    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          description: User password

    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        token_type:
          type: string
          enum:
            - bearer
          description: Token type

    RefreshResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: Newly generated JWT access token
        token_type:
          type: string
          enum:
            - bearer
          description: Token type

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message returned by the Identity Service