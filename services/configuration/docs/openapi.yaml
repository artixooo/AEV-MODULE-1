
openapi: 3.0.3
info:
  title: Configuration Service API
  description: >
    API surface for the Configuration Service. Backs authentication-related
    runtime configuration (e.g. JWT settings) as well as general-purpose
    scoped configuration and feature flags, per the approved database
    schema (configuration, feature_flags, configuration_history).
  version: "1.0.0"

servers:
  - url: /api/v1

tags:
  - name: Configuration
    description: Read and write scoped configuration key/value entries.
  - name: Feature Flags
    description: Read feature flag state. Write endpoints out of scope this week.

paths:
  /config/{key}:
    get:
      operationId: getConfig
      tags: [Configuration]
      summary: Get a single configuration entry by key
      description: Looks up one row from the configuration table by its globally unique config_key.
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
      responses:
        '200':
          description: The configuration entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '404':
          description: No configuration entry exists for this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      operationId: putConfig
      tags: [Configuration]
      summary: Create or update a configuration entry
      description: >
        Upserts a row in configuration keyed on config_key. Every successful
        call writes an audit row to configuration_history recording the old
        and new value.
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigWriteRequest'
      responses:
        '200':
          description: Existing configuration entry updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '201':
          description: New configuration entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /feature-flags:
    get:
      operationId: listFeatureFlags
      tags: [Feature Flags]
      summary: List feature flags
      description: >
        Returns feature flags from the feature_flags table, optionally
        narrowed by scope and/or a specific organization, workspace, or
        project. Read-only this week.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Scope'
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of feature flags matching the filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ConfigKey:
      name: key
      in: path
      required: true
      description: The unique config_key identifying the configuration entry.
      schema:
        type: string
        example: jwt_access_token_ttl_seconds

  responses:
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Scope:
      type: string
      description: >
        Which level of the org hierarchy this entry applies to, matching
        repository.Scope in models.go.
      enum: [GLOBAL, ORGANIZATION, WORKSPACE, PROJECT]
      example: GLOBAL

    DataType:
      type: string
      description: >
        How config_value should be parsed, matching repository.DataType
        in models.go.
      enum: [STRING, INT, FLOAT, BOOL, JSON]
      example: INT

    Configuration:
      type: object
      description: Mirrors the repository.Configuration struct in models.go.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        config_key:
          type: string
          example: jwt_access_token_ttl_seconds
        config_value:
          type: string
          example: "900"
        data_type:
          $ref: '#/components/schemas/DataType'
        scope:
          $ref: '#/components/schemas/Scope'
        organization_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - config_key
        - config_value
        - data_type
        - scope
        - is_editable
        - created_at
        - updated_at

    ConfigWriteRequest:
      type: object
      description: Request body for PUT /config/{key}, matching repository.SaveConfigInput.
      properties:
        config_value:
          type: string
          example: "900"
        data_type:
          $ref: '#/components/schemas/DataType'
        scope:
          $ref: '#/components/schemas/Scope'
          default: GLOBAL
        organization_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true
        change_reason:
          type: string
          nullable: true
          description: Stored in configuration_history.change_reason for auditing.
          example: "raising JWT TTL for enterprise tier"
      required:
        - config_value
        - data_type

    FeatureFlag:
      type: object
      description: Mirrors the repository.FeatureFlag struct in models.go.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        flag_key:
          type: string
          example: new_checkout_flow
        flag_name:
          type: string
          example: New Checkout Flow
        description:
          type: string
          nullable: true
        is_enabled:
          type: boolean
          default: false
        scope:
          $ref: '#/components/schemas/Scope'
        organization_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - flag_key
        - flag_name
        - is_enabled
        - scope
        - rollout_percentage
        - created_at
        - updated_at

    Error:
      type: object
      properties:
        error:
          type: string
          example: "config_key is required"
      required:
        - error
