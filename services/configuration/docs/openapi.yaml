openapi: 3.0.3
info:
  title: Configuration Service API
  description: >
    API surface for the Configuration Service. Backs authentication-related
    runtime configuration (e.g. JWT settings) as well as general-purpose
    scoped configuration and feature flags, per the approved database
    schema (configuration, feature_flags, configuration_history).
  version: "1.0.0"

servers:
  - url: /api/v1

tags:
  - name: Configuration
    description: Read and write scoped configuration key/value entries.
  - name: Feature Flags
    description: Read feature flag state. Write endpoints out of scope this week.
  - name: Identity Provider
    description: Tenant-scoped identity-provider configuration for the Identity Service (Week 4).

paths:
  /config/{key}:
    get:
      operationId: getConfig
      tags: [Configuration]
      summary: Get a single configuration entry by key
      description: Looks up one row from the configuration table by its globally unique config_key.
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
      responses:
        '200':
          description: The configuration entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '404':
          description: No configuration entry exists for this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      operationId: putConfig
      tags: [Configuration]
      summary: Create or update a configuration entry
      description: >
        Upserts a row in configuration keyed on config_key. Every successful
        call writes an audit row to configuration_history recording the old
        and new value.
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigWriteRequest'
      responses:
        '200':
          description: Existing configuration entry updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '201':
          description: New configuration entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /feature-flags:
    get:
      operationId: listFeatureFlags
      tags: [Feature Flags]
      summary: List feature flags
      description: >
        Returns feature flags from the feature_flags table, optionally
        narrowed by scope and/or a specific organization, workspace, or
        project. Read-only this week.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Scope'
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of feature flags matching the filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizations/{organizationId}/identity-provider:
    get:
      operationId: getIdentityProviderConfig
      tags: [Identity Provider]
      summary: Get an organization's identity-provider configuration
      description: >
        Retrieves the tenant-scoped identity-provider configuration for the
        given organization. Stored internally as a configuration entry keyed
        by organization, per docs/config_identity-provider.md. Never returns
        actual secret values — only *_ref placeholders.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The organization's identity-provider configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderConfig'
        '404':
          description: No identity-provider configuration exists for this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      operationId: putIdentityProviderConfig
      tags: [Identity Provider]
      summary: Create or update an organization's identity-provider configuration
      description: >
        Upserts the identity-provider configuration for the given organization.
        Requests containing raw sensitive fields (client_secret, api_key,
        private_key, password, signing_key, access_token, refresh_token,
        scim_token) are rejected with 400 — only *_ref fields are accepted.
        Tenant isolation is enforced: this can only create or modify the
        specified organization's own configuration.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderConfig'
      responses:
        '200':
          description: Existing identity-provider configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderConfig'
        '201':
          description: New identity-provider configuration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderConfig'
        '400':
          description: >
            Invalid request — either a validation failure (e.g. malformed URL,
            missing required field for the provider type) or an attempt to
            submit a raw sensitive field instead of a *_ref placeholder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ConfigKey:
      name: key
      in: path
      required: true
      description: The unique config_key identifying the configuration entry.
      schema:
        type: string
        example: jwt_access_token_ttl_seconds

    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: UUID of the organization (tenant) this configuration belongs to.
      schema:
        type: string
        format: uuid
        example: 11111111-1111-1111-1111-111111111111

  responses:
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Scope:
      type: string
      description: >
        Which level of the org hierarchy this entry applies to, matching
        repository.Scope in models.go.
      enum: [GLOBAL, ORGANIZATION, WORKSPACE, PROJECT]
      example: GLOBAL

    DataType:
      type: string
      description: >
        How config_value should be parsed, matching repository.DataType
        in models.go.
      enum: [STRING, INT, FLOAT, BOOL, JSON]
      example: INT

    Configuration:
      type: object
      description: Mirrors the repository.Configuration struct in models.go.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        config_key:
          type: string
          example: jwt_access_token_ttl_seconds
        config_value:
          type: string
          example: "900"
        data_type:
          $ref: '#/components/schemas/DataType'
        scope:
          $ref: '#/components/schemas/Scope'
        organization_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - config_key
        - config_value
        - data_type
        - scope
        - is_editable
        - created_at
        - updated_at

    ConfigWriteRequest:
      type: object
      description: Request body for PUT /config/{key}, matching repository.SaveConfigInput.
      properties:
        config_value:
          type: string
          example: "900"
        data_type:
          $ref: '#/components/schemas/DataType'
        scope:
          $ref: '#/components/schemas/Scope'
          default: GLOBAL
        organization_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true
        change_reason:
          type: string
          nullable: true
          description: Stored in configuration_history.change_reason for auditing.
          example: "raising JWT TTL for enterprise tier"
      required:
        - config_value
        - data_type

    FeatureFlag:
      type: object
      description: Mirrors the repository.FeatureFlag struct in models.go.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        flag_key:
          type: string
          example: new_checkout_flow
        flag_name:
          type: string
          example: New Checkout Flow
        description:
          type: string
          nullable: true
        is_enabled:
          type: boolean
          default: false
        scope:
          $ref: '#/components/schemas/Scope'
        organization_id:
          type: string
          format: uuid
          nullable: true
        workspace_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - flag_key
        - flag_name
        - is_enabled
        - scope
        - rollout_percentage
        - created_at
        - updated_at

    IdentityProviderConfig:
      type: object
      description: >
        Generic, extensible identity-provider configuration, matching the
        idpconfig.ProviderConfig struct. Supports oidc, oauth2, and saml
        provider types per docs/config_identity-provider.md. Provider-specific
        fields are optional at the schema level; required-field validation
        depends on the selected type.
      properties:
        type:
          type: string
          enum: [oidc, oauth2, saml]
          example: oidc
        name:
          type: string
          nullable: true
          example: company-oidc
        enabled:
          type: boolean
          default: false
        issuer_url:
          type: string
          format: uri
          nullable: true
          example: https://identity.example.com
        authorization_url:
          type: string
          format: uri
          nullable: true
        token_url:
          type: string
          format: uri
          nullable: true
        userinfo_url:
          type: string
          format: uri
          nullable: true
        jwks_url:
          type: string
          format: uri
          nullable: true
        client_id:
          type: string
          nullable: true
          example: client-123
        client_secret_ref:
          type: string
          nullable: true
          description: Reference to the actual secret stored in Secrets Service. Never the raw secret value.
          example: secret://identity/org-123/client-secret
        scopes:
          type: array
          items:
            type: string
          nullable: true
          example: [openid, profile, email]
      required:
        - type
        - enabled

    Error:
      type: object
      properties:
        error:
          type: string
          example: "config_key is required"
      required:
        - error